name: 'Setup Rust'
description: 'Install Rust toolchain, optional GTK deps for Tauri, and cargo cache'

inputs:
  rust-toolchain:
    description: 'Rust toolchain channel/version'
    required: false
    default: 'stable'
  rust-targets:
    description: 'Additional Rust targets (comma-separated)'
    required: false
    default: ''
  rust-components:
    description: 'Rust components (comma-separated)'
    required: false
    default: 'clippy,rustfmt'
  with-gtk:
    description: 'Install Linux WebKitGTK / Tauri system dependencies'
    required: false
    default: 'false'
  cache-key-prefix:
    description: 'Prefix for cargo cache key (separate desktop vs android caches)'
    required: false
    default: 'cargo'

runs:
  using: 'composite'
  steps:
    - name: Install Linux system dependencies
      if: inputs.with-gtk == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        targets: ${{ inputs.rust-targets }}
        components: ${{ inputs.rust-components }}

    - name: Cache Rust dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/src/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-${{ hashFiles('src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key-prefix }}-
