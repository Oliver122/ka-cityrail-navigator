name: 'Setup Android'
description: 'Install Java, Android SDK, and NDK'

inputs:
  java-version:
    description: 'Java version'
    required: false
    default: '17'
  ndk-version:
    description: 'Android NDK version'
    required: false
    default: 'r26b'

outputs:
  ndk-path:
    description: 'Path to Android NDK'
    value: ${{ steps.setup-ndk.outputs.ndk-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Java
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

    - name: Setup Android NDK
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ inputs.ndk-version }}
        add-to-path: true
